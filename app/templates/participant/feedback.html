{% extends "base.html" %}
{% block title %}Feedback — EventSphere{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">{% endblock %}

{% block content %}
<div class="dash-shell">
  {% include "participant/_sidebar.html" %}
  <main class="dash-main">
    <div class="panel" style="max-width:520px;">
      <h1>How was {{ event.title }}?</h1>
      <p>Your organiser reads every response.</p>
      <form method="POST">
        <div class="form-group">
          <label for="rating">Rating</label>
          <select id="rating" name="rating">
            <option value="5">★★★★★ Excellent</option>
            <option value="4">★★★★☆ Good</option>
            <option value="3">★★★☆☆ Okay</option>
            <option value="2">★★☆☆☆ Not great</option>
            <option value="1">★☆☆☆☆ Poor</option>
          </select>
        </div>
        <div class="form-group">
          <label for="comments">Anything you'd tell the organiser?</label>
          <textarea id="comments" name="comments" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Submit feedback</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
