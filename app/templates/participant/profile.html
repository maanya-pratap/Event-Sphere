{% extends "base.html" %}
{% block title %}Profile — EventSphere{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">{% endblock %}

{% block content %}
<div class="dash-shell">
  {% include "participant/_sidebar.html" %}
  <main class="dash-main">
    <div class="panel" style="max-width:520px;">
      <h1>Your profile</h1>
      <p>Member since {{ current_user.created_at.strftime('%d %B %Y') }}</p>
      <form method="POST">
        <div class="form-group"><label for="name">Full name</label>
          <input type="text" id="name" name="name" value="{{ current_user.name }}" required></div>
        <div class="form-group"><label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ current_user.email }}" required></div>
        <div class="form-group"><label for="mobile">Mobile number</label>
          <input type="text" id="mobile" name="mobile" value="{{ current_user.mobile or '' }}"></div>
        <hr style="border:0; border-top:1px solid rgba(167,159,209,0.2); margin:20px 0;">
        <h2 style="font-size:1.05rem;">Change password</h2>
        <div class="form-group"><label for="current_password">Current password</label>
          <input type="password" id="current_password" name="current_password" placeholder="Required only if changing your password" autocomplete="current-password"></div>
        <div class="form-group"><label for="new_password">New password (min 6 characters)</label>
          <input type="password" id="new_password" name="new_password" autocomplete="new-password"></div>
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
