{% extends "base.html" %}
{% block title %}New event — EventSphere{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">{% endblock %}

{% block content %}
<div class="dash-shell">
  {% include "organiser/_sidebar.html" %}
  <main class="dash-main">
    <div class="panel" style="max-width:620px;">
      <h1>Create an event</h1>
      <p>It goes live to participants the moment you publish it.</p>
      <form method="POST">
        <div class="form-group">
          <label for="title">Event title</label>
          <input type="text" id="title" name="title" required placeholder="e.g. Hacknight 6.0">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" placeholder="What should people expect?"></textarea>
        </div>
        <div class="field-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option>General</option>
              <option>Technical</option>
              <option>Cultural</option>
              <option>Sports</option>
              <option>Workshop</option>
              <option>Fest</option>
            </select>
          </div>
          <div class="form-group">
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" name="capacity" value="100" min="1">
          </div>
        </div>
        <div class="form-group">
          <label for="venue">Venue</label>
          <input type="text" id="venue" name="venue" placeholder="e.g. Main Auditorium">
        </div>
        <div class="field-row">
          <div class="form-group">
            <label for="start_time">Starts</label>
            <input type="datetime-local" id="start_time" name="start_time" required>
          </div>
          <div class="form-group">
            <label for="end_time">Ends</label>
            <input type="datetime-local" id="end_time" name="end_time">
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Publish event</button>
      </form>
    </div>
  </main>
</div>
{% endblock %}
